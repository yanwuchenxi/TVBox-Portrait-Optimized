name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Avoid obsolete sdkmanager package "tools" (breaks android-actions/setup-android defaults)
      - name: Setup Android SDK cmdline-tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true

      - name: Build javaDebug APK
        run: ./gradlew assembleJavaDebug --stacktrace --no-daemon

      - name: List outputs
        if: always()
        run: find app/build/outputs -type f 2>/dev/null || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tvbox-java-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
